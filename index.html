<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112f29"><title>Collings Clock Stopper</title></head><body><main class="app"><p class="eyebrow">COLLINGS · CLOCK STOPPER</p><h1>Stop the clock at <span>10.00</span></h1><p class="sub">How close can you get?</p><div id="clock" class="clock" aria-live="off">0.00</div><button id="toggle" class="primary">START</button><p id="message" class="message" aria-live="polite">Tap start, then stop as close to 10.00 seconds as possible.</p><form id="scoreForm" hidden><label for="player">Your name</label><div class="entry"><input id="player" maxlength="30" required placeholder="Enter your name"><button type="submit">SAVE SCORE</button></div></form><section><div class="heading"><h2>Leaderboard</h2><button id="showAll" class="text-button">View Top 10</button></div><p class="note">Local demo only. Scores are saved on this device, not shared between players.</p><ol id="scores"></ol></section></main><script type="module" src="/src.js"></script></body></html>
