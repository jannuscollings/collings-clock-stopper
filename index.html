<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112f29"><title>Collings Clock Stopper</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f7f9f6;background:#0d211d;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:32px 18px}.app{max-width:550px;margin:0 auto;text-align:center}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:#76c8a2}h1{font-size:clamp(28px,6vw,42px);line-height:1.12;margin:34px 0 10px}h1 span{color:#75d6a0}.sub,.note{color:#a8bcb3}.clock{font-variant-numeric:tabular-nums;font-size:clamp(88px,22vw,142px);font-weight:800;letter-spacing:-.08em;margin:45px 0 12px}.primary,.entry button{background:#46bc80;color:#07221a;border:0;border-radius:14px;padding:17px 45px;font-size:16px;font-weight:900;cursor:pointer}.message{min-height:45px;color:#c7d7d0;font-size:14px;margin:24px 0}form{text-align:left;background:#15332c;border-radius:18px;padding:20px;margin-top:24px}form[hidden]{display:none}label{display:block;margin-bottom:9px;font-weight:700}.entry{display:flex;gap:9px}.entry input{width:100%;min-width:0;background:#081b16;border:1px solid #3e6856;color:white;border-radius:10px;padding:12px;font-size:15px}.entry button{white-space:nowrap;font-size:12px;padding:12px}section{text-align:left;margin-top:42px;border-top:1px solid #315346;padding-top:15px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px}h2{font-size:21px}.text-button{border:0;background:none;color:#70d6a0;cursor:pointer}.note{font-size:12px;line-height:1.5}ol{list-style:none;padding:0}li{padding:12px 8px;border-bottom:1px solid #28483b;display:flex;justify-content:space-between}li strong{font-variant-numeric:tabular-nums}</style></head><body><main class="app"><p class="eyebrow">COLLINGS · CLOCK STOPPER</p><h1>Stop the clock at <span>10.00</span></h1><p class="sub">How close can you get?</p><div id="clock" class="clock" aria-live="off">0.00</div><button id="toggle" class="primary">START</button><p id="message" class="message" aria-live="polite">Tap start, then stop as close to 10.00 seconds as possible.</p><form id="scoreForm" hidden><label for="player">Your name</label><div class="entry"><input id="player" maxlength="30" required placeholder="Enter your name"><button type="submit">SAVE SCORE</button></div></form><section><div class="heading"><h2>Leaderboard</h2><button id="showAll" class="text-button">View Top 10</button></div><p class="note">Local demo only. Scores are saved on this device, not shared between players.</p><ol id="scores"></ol></section></main><script type="module" src="/src.js"></script></body></html>
